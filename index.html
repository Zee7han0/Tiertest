<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Void Tiertests</title>
<style>
:root{--bg:#07070b;--panel:#101018;--panel2:#171322;--purple:#8b5cf6;--purple2:#a855f7;--text:#f5f3ff;--muted:#a8a3b8;--border:#2a2140}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#25123d 0,#0b0810 38%,var(--bg) 72%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,92%);margin:auto}.hero{text-align:center;padding:70px 0 34px}.brand{font-size:clamp(42px,7vw,82px);font-weight:900;letter-spacing:-3px;margin:0;background:linear-gradient(90deg,#fff,var(--purple2));-webkit-background-clip:text;color:transparent}.tag{color:var(--muted);margin:10px 0 0;font-size:16px}.card{background:linear-gradient(145deg,rgba(23,19,34,.95),rgba(12,11,17,.95));border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px #0008;padding:22px;margin:18px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.search{flex:1;min-width:220px;background:#09090d;border:1px solid var(--border);border-radius:12px;padding:13px 15px;color:#fff;outline:none}.search:focus{border-color:var(--purple)}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.tab{background:#0c0b11;color:var(--muted);border:1px solid var(--border);padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}.tab.active,.tab:hover{background:#24163b;color:#fff;border-color:#6d3fc0}.table{width:100%;border-collapse:collapse}.table th{color:#8f899f;text-align:left;font-size:12px;text-transform:uppercase;padding:13px;border-bottom:1px solid var(--border)}.table td{padding:15px 13px;border-bottom:1px solid #211b2d}.rank{color:var(--purple2);font-weight:800}.player{font-weight:800}.points{color:#d8b4fe;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#24163b;color:#d8b4fe;font-size:12px;margin:2px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#18121f;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--purple);border-color:var(--purple);font-weight:800}.btn.danger{color:#ff9b9b}.empty{text-align:center;padding:40px;color:var(--muted)}.footer{text-align:center;color:#666174;padding:30px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{width:min(430px,100%);background:#100d16;border:1px solid var(--border);border-radius:18px;padding:25px}.modalbox h2{margin-top:0}.field{width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--border);background:#08070b;color:#fff}.notice{color:#ff9b9b;min-height:20px;font-size:13px}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><h1 class="brand">VOID TIERTTESTS</h1><p class="tag">Competitive Minecraft tier testing • rankings • leaderboards</p></div></header>
<main class="wrap">
<section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Search player..."/><button class="btn primary" id="adminBtn">Admin</button></div><div class="tabs" id="tabs"></div><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Region</th><th>Tier</th><th>Points</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" style="display:none">No players found.</div></section>
</main><footer class="footer">Void Tiertests</footer>
<div class="modal" id="modal"><div class="modalbox"><h2>Admin Login</h2><input id="password" type="password" class="field" placeholder="Admin password"/><div id="notice" class="notice"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="close">Cancel</button><button class="btn primary" id="login">Login</button></div></div></div>
<script>
const modes=['Overall','Crystal','UHC','Pot','Neth Pot','SMP','Sword','Axe','Mace'];let players=[];let active='Overall';let isAdmin=false;
const $=id=>document.getElementById(id);const tabs=$('tabs');
modes.forEach(m=>{const b=document.createElement('button');b.className='tab'+(m===active?' active':'');b.textContent=m;b.onclick=()=>{active=m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};tabs.appendChild(b)});
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{const d=await api('/api/players');players=d.players||[]}catch(e){players=[]}render()}
function tier(p){if(active==='Overall')return p.title||'---';return p.tiers?.[active]||p.tiers?.[active.replace(' ','_')]||'---'}
function render(){const q=$('search').value.toLowerCase();let arr=players.filter(p=>String(p.username||'').toLowerCase().includes(q));arr.sort((a,b)=>(b.points||0)-(a.points||0));$('rows').innerHTML=arr.map((p,i)=>`<tr><td class="rank">${i+1}</td><td class="player">${esc(p.username)}</td><td>${esc(p.region||'Global')}</td><td>${esc(tier(p))}</td><td class="points">${p.points||0}</td><td>${isAdmin?`<button class="btn danger" onclick="del('${escAttr(p.username)}')">Delete</button>`:''}</td></tr>`).join('');$('empty').style.display=arr.length?'none':'block'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return String(s??'').replace(/'/g,"\\'")}
async function del(u){if(!confirm('Delete '+u+'?'))return;await api('/api/players/'+encodeURIComponent(u),{method:'DELETE'});load()}
$('search').oninput=render;$('adminBtn').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('login').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});isAdmin=true;$('modal').classList.remove('show');render()}catch(e){$('notice').textContent='Invalid password'}};load();
</script>
<!-- Void Tierttests v2: GitHub Pages cache-bust -->
</body></html>

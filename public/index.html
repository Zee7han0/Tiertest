<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Void Tiertests</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css"></head>
<body><nav class="navbar"><div class="nav-left"><div class="logo" id="logo-trigger">VOID <span>TIERTTESTS</span></div><div class="nav-links"><a class="active" href="#"><i class="fa-solid fa-house"></i> Home</a><a href="#rankings"><i class="fa-solid fa-trophy"></i> Rankings</a><a href="#"><i class="fa-brands fa-discord"></i> Discord</a><a href="#"><i class="fa-solid fa-code"></i> API</a></div></div><div class="search-bar"><i class="fa-solid fa-magnifying-glass"></i><input id="search-input" type="text" placeholder="Search player..."></div></nav>
<main class="content-container"><section class="admin-panel" id="admin-section"><div class="panel-heading"><div><h3><i class="fa-solid fa-user-gear"></i> Admin Control Panel</h3><p>Manage players stored in the server database.</p></div><button class="backup-btn danger" id="logout-btn">Logout</button></div><form id="add-player-form"><div class="form-row"><div class="form-group"><label>Username</label><input id="p-username" maxlength="16" placeholder="Minecraft Username" required></div><div class="form-group"><label>Title</label><select id="p-title"><option>Combat Master</option><option>Combat Ace</option></select></div><div class="form-group"><label>Points</label><input id="p-points" type="number" min="0" placeholder="Points" required></div><div class="form-group"><label>Region</label><select id="p-region"><option>NA</option><option>EU</option><option>AS</option><option>OC</option></select></div></div><label class="tier-heading">Assign Game Mode Tiers</label><div class="tier-inputs-grid" id="tier-dropdowns-container"></div><button class="submit-btn" type="submit"><i class="fa-solid fa-plus"></i> Add Player</button></form></section><div class="tabs-container" id="rankings"><button class="tab-btn active" data-mode="Overall"><span>🌐</span>Overall</button><button class="tab-btn" data-mode="Crystal"><span>💎</span>Vanilla</button><button class="tab-btn" data-mode="UHC"><span>❤️</span>UHC</button><button class="tab-btn" data-mode="Pot"><span>🧪</span>Pot</button><button class="tab-btn" data-mode="Neth Pot"><span>🪖</span>NethOP</button><button class="tab-btn" data-mode="SMP"><span>🟢</span>SMP</button><button class="tab-btn" data-mode="Sword"><span>🗡️</span>Sword</button><button class="tab-btn" data-mode="Axe"><span>🪓</span>Axe</button><button class="tab-btn" data-mode="Mace"><span>🔨</span>Mace</button></div><div class="info-row"><button class="info-btn danger" id="clear-all-btn"><i class="fa-solid fa-trash"></i> Wipe All</button><div class="server-ip">VOID TIERTESTS</div></div><section class="leaderboard-table"><div class="table-header"><div>#</div><div>PLAYER</div><div>REGION</div><div>TIERS</div><div class="actions-header">ACTIONS</div></div><div id="leaderboard-rows"></div></section></main><div class="modal" id="login-modal"><div class="modal-card"><button class="modal-close" id="close-login">&times;</button><h2>Admin Login</h2><p>Enter your server admin password.</p><input id="admin-password" type="password" placeholder="Password"><button class="submit-btn" id="login-btn">Login</button><div id="login-error" class="error"></div></div></div><script src="app.js"></script></body></html>
